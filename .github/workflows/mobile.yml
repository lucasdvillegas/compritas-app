name: Mobile builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: Plataforma a compilar
        required: true
        type: choice
        options:
          - android
          - ios
          - both
        default: android
      upload:
        description: Subir el IPA a App Store Connect
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    if: inputs.target == 'android' || inputs.target == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el AAB se generará sin firmar."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android.keystore"

          jq -n \
            --arg store "$STORE_PASSWORD" \
            --arg alias "$KEY_ALIAS" \
            --arg key "$KEY_PASSWORD" \
            '{
              android: {
                release: {
                  keystore: "/run/secrets/android_keystore",
                  storePassword: $store,
                  alias: $alias,
                  password: $key,
                  packageType: "bundle"
                }
              }
            }' > "$RUNNER_TEMP/android-build.json"

      - name: Compilar Android en Docker
        env:
          QCLI_API_URL: ${{ secrets.QCLI_API_URL }}
        run: |
          if [ -z "$QCLI_API_URL" ]; then
            echo "::error::Falta el secret QCLI_API_URL"
            exit 1
          fi

          args=(
            build
            --platform linux/amd64
            --build-arg "QCLI_API_URL=$QCLI_API_URL"
            --build-arg ANDROID_PACKAGE_TYPE=bundle
            --target export
            --output type=local,dest=dist-mobile
          )

          if [ -f "$RUNNER_TEMP/android-build.json" ]; then
            args+=(--secret "id=android_build_json,src=$RUNNER_TEMP/android-build.json")
            args+=(--secret "id=android_keystore,src=$RUNNER_TEMP/android.keystore")
          fi

          docker build "${args[@]}" .

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: compritapp-android
          path: dist-mobile/android
          if-no-files-found: error

  ios:
    if: inputs.target == 'ios' || inputs.target == 'both'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: |
          npm ci
          npm install --global cordova@13.0.0

      - name: Agregar plataforma iOS
        run: cd src-cordova && cordova platform add ios@8.1.1

      - name: Validar credenciales de Apple
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_TEAM_ID APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name"
              exit 1
            fi
          done

      - name: Importar certificado y API key
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$IOS_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "$APPSTORE_PRIVATE_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$API_KEY_PATH" "$HOME/.appstoreconnect/private_keys/"

          jq -n \
            --arg team "$IOS_TEAM_ID" \
            --arg keyPath "$API_KEY_PATH" \
            --arg keyId "$APPSTORE_KEY_ID" \
            --arg issuer "$APPSTORE_ISSUER_ID" \
            '{
              ios: {
                release: {
                  codeSignIdentity: "Apple Distribution",
                  developmentTeam: $team,
                  packageType: "app-store",
                  automaticProvisioning: true,
                  authenticationKeyPath: $keyPath,
                  authenticationKeyID: $keyId,
                  authenticationKeyIssuerID: $issuer
                }
              }
            }' > src-cordova/build.json

      - name: Compilar iOS
        env:
          QCLI_API_URL: ${{ secrets.QCLI_API_URL }}
        run: |
          if [ -z "$QCLI_API_URL" ]; then
            echo "::error::Falta el secret QCLI_API_URL"
            exit 1
          fi

          xcodebuild -version
          pod --version
          npx quasar build -m cordova -T ios

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: compritapp-ios
          path: dist/cordova/ios
          if-no-files-found: error

      - name: Subir a App Store Connect
        if: inputs.upload
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          IPA="$(find dist/cordova/ios -name '*.ipa' -print -quit)"

          if [ -z "$IPA" ]; then
            echo "::error::No se encontró ningún IPA"
            exit 1
          fi

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Limpiar keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
